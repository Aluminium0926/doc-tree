name: build-macos

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "CPU 架构（arm64 = Apple Silicon，x64 = Intel）"
        required: true
        default: arm64
        type: choice
        options: [arm64, x64]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install deps
        run: npm install --no-audit --no-fund

      - name: package .app
        run: |
          npx --yes @electron/packager@18 . DocTree \
            --platform=darwin \
            --arch=${{ inputs.arch }} \
            --out=release-mac \
            --overwrite \
            --asar=false \
            --prune=true \
            --ignore='^/release' \
            --ignore='^/mobile' \
            --ignore='^/docs'

      - name: zip app
        run: |
          cd release-mac
          ls -la
          ditto -c -k --keepParent "DocTree-darwin-${{ inputs.arch }}" "DocTree-mac-${{ inputs.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DocTree-mac-${{ inputs.arch }}
          path: release-mac/DocTree-mac-${{ inputs.arch }}.zip
          retention-days: 14
